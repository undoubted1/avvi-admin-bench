<script>
  // Set the theme before first paint so dark-mode readers never see a light flash.
  (function () {
    var pref = localStorage.getItem("theme") || "auto";
    var dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="/app/app.css">

<a class="skip" href="#main">Skip to content</a>
<div class="shell">

      <img class="logo on-light" src="/app/brand/avvi-logo.png" alt="" width="74" height="26">
      <img class="logo on-dark" src="/app/brand/avvi-logo-dark.png" alt="" width="74" height="26">

    <main id="main" tabindex="-1"></main>
    <footer class="foot">
      <div class="foot-in">
        <div class="foot-brand">
          <img class="logo" src="/app/brand/avvi-logo-dark.png" alt="Avvi" width="74" height="26">
